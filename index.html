<!doctype html>
<!--
  ============================================================
  HOMENAJE A JOSÉ JOSÉ — "El Príncipe de la Canción"
  ------------------------------------------------------------
  Página de una sola vista (landing page) que rinde homenaje al
  cantante mexicano. Estructura básica:

    1) <head>  -> metadatos, fuentes de Google y hojas de estilo
    2) <header>-> logo de la marca + botón de música de fondo
    3) <main>  -> sección "hero": titular + retrato tipo vinilo
    4) <footer>-> enlaces a las plataformas donde se escucha su música
    5) scripts -> script.js (carrusel de fotos) y musica.js (reproductor)

  El estilo visual está repartido en dos archivos CSS:
     - styles.css  : todo el diseño general de la página
     - musica.css  : solo el botón de música y sus animaciones
  ============================================================
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Descripción que los buscadores muestran como resumen del sitio. -->
    <meta name="description" content="Un homenaje a José José, El Príncipe de la Canción." />
    <title>José José — El Príncipe de la Canción</title>

    <!-- Fuentes de Google: conectamos al servidor y cargamos dos familias. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cormorant Garamond (títulos elegantes) y DM Sans (textos corporales). -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/webp" sizes="32x32" href="assets/iconos/favicon-32x32.webp" />
    <link rel="icon" type="image/webp" sizes="16x16" href="assets/iconos/favicon-16x16.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/iconos/apple-touch-icon.png" />
    <link rel="icon" href="assets/iconos/favicon.ico" />
    <link rel="manifest" href="manifest.json" />

    <!-- Hojas de estilo: primero lo general y después lo específico de música. -->
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="musica.css" />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body>
    <!-- ======================================================
         ENCABEZADO (barra superior)
         - Izquierda: logo de la marca (enlaza al inicio de la página)
         - Centro: botón redondo que controla la música de fondo
         ====================================================== -->
    <header class="site-header">
      <!-- El anchor con href="#inicio" lleva a la sección id="inicio" (scroll suave). -->
      <a class="brand" href="#inicio" aria-label="José José, inicio">
        <img class="brand-logo" src="assets/logo-jose-jose.webp" alt="Logo de José José" />
      </a>

      <!-- Botón de música de fondo: cápsula con las ondas radiales a la
           izquierda, el nombre de la canción y, al final, el icono ▶|
           integrado (sin caja propia) para saltar a la siguiente pista.
           aria-pressed indica a los lectores de pantalla si está activado. -->
      <button class="boton-musica" type="button" aria-label="Activar música de fondo" aria-pressed="false">
        <span class="visual-musica" aria-hidden="true">
          <img class="icono-app-musica" src="assets/icono-reproductor-jose.webp" alt="" />
          <span class="ondas-musicales"><i></i><i></i><i></i><i></i></span>
        </span>
        <span class="nombre-cancion"><span class="texto-cancion">O Tú o Yo</span></span>
        <span class="boton-siguiente" aria-hidden="true">▶︎|</span>
      </button>
    </header>

    <!-- ======================================================
         CONTENIDO PRINCIPAL
         Sección "hero" (portada): a la izquierda el texto con el
         titular y a la derecha el retrato que gira como un vinilo.
         ====================================================== -->
    <main id="inicio">
      <section class="hero">
        <!-- Columna de texto / titular -->
        <div class="hero-copy">
          <!-- Pequeña etiqueta superior con un punto dorado (span vacío). -->
          <p class="eyebrow"><span></span> Homenaje a José José</p>
          <!-- Título principal en formato de imagen para conservar su diseño original. -->
          <img class="hero-title-image" src="assets/texto-el-principe.webp" alt="El Príncipe de la Canción" />
          <p class="hero-intro">José Rómulo Sosa Ortiz, fue conocido como "El Príncipe de la Canción", es uno de los cantantes más importantes, populares y exitosos de la historia de la música en español.</p>
        </div>

        <!-- Columna del retrato -->
        <div class="hero-portrait">
          <!-- Marco circular dorado que envuelve el "vinilo". -->
          <div class="portrait-frame">
            <!-- Halo de luz detrás del retrato. -->
            <div class="portrait-glow"></div>
            <!-- El disco: un <div> redondeado que gira y dentro lleva la
                 fotografía (.foto-carrusel) que cambia sola (JS). -->
            <div class="record-carousel" aria-label="Fotografías de José José">
              <img class="foto-carrusel" src="assets/jose-jose-retrato-circular.webp" alt="Retrato de José José" />
              <!-- Capas decorativas que simulan los surcos y el reflejo del vinilo. -->
              <span class="surcos-vinilo" aria-hidden="true"></span>
              <span class="reflejo-vinilo" aria-hidden="true"></span>
            </div>
          </div>
          <!-- Cartel con las fechas y el apodo del artista. -->
          <div class="portrait-caption"><span>1948 — 2019</span><strong>El Príncipe</strong></div>
          <!-- Órbitas elípticas decorativas alrededor del retrato. -->
          <div class="orbit orbit-one"></div>
          <div class="orbit orbit-two"></div>
        </div>

      </section>
    </main>

    <!-- ======================================================
         PIE DE PÁGINA
         Enlaces oficiales a las plataformas de streaming donde se
         puede escuchar la música de José José.
         target="_blank" abre en una pestaña nueva
         rel="noopener noreferrer" es una medida de seguridad básica.
         ====================================================== -->
    <footer class="site-footer">
      <nav class="platform-links" aria-label="Enlaces oficiales de José José">
        <!-- El sitio oficial aparece primero como referencia principal. -->
        <a class="official-logo-link" href="https://josejoseoficial.com.mx/" target="_blank" rel="noopener noreferrer" aria-label="Página oficial de José José">
          <img src="assets/logo-jose-jose.webp" alt="Página oficial de José José" loading="lazy" decoding="async" />
        </a>
        <a class="platform-icon-link" href="https://www.youtube.com/channel/UCSPwNgHHyAtHanVaGN2LLWA" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
          <img src="assets/youtube.webp" alt="YouTube" loading="lazy" decoding="async" />
        </a>
        <a class="platform-icon-link" href="https://open.spotify.com/artist/4mN0qcMxWX8oToqfDPM5yV" target="_blank" rel="noopener noreferrer" aria-label="Spotify">
          <img src="assets/spotify.webp" alt="Spotify" loading="lazy" decoding="async" />
        </a>
        <a class="platform-icon-link" href="https://music.youtube.com/channel/UCSPwNgHHyAtHanVaGN2LLWA" target="_blank" rel="noopener noreferrer" aria-label="YouTube Music">
          <img src="assets/youtube-music.webp" alt="YouTube Music" loading="lazy" decoding="async" />
        </a>
        <a class="platform-icon-link" href="https://music.apple.com/us/artist/jos%C3%A9-jos%C3%A9/333303" target="_blank" rel="noopener noreferrer" aria-label="Apple Music">
          <img src="assets/apple-music.webp" alt="Apple Music" loading="lazy" decoding="async" />
        </a>
        <a class="platform-icon-link" href="https://music.amazon.com/artists/B001369092/jos%C3%A9-jos%C3%A9" target="_blank" rel="noopener noreferrer" aria-label="Amazon Music">
          <img src="assets/amazon.webp" alt="Amazon Music" loading="lazy" decoding="async" />
        </a>
        <a class="platform-icon-link deezer-link" href="https://www.deezer.com/search/Jos%C3%A9%20Jos%C3%A9" target="_blank" rel="noopener noreferrer" aria-label="Deezer">
          <img src="assets/deezer.webp" alt="Deezer" loading="lazy" decoding="async" />
        </a>
      </nav>
      <p class="footer-disclaimer">Homenaje a José José · Sin fines de lucro · Sitio no oficial.</p>
    </footer>
    <!-- defer hace que los scripts se ejecuten tras leer el HTML,
         así el DOM ya existe cuando el JS busca sus elementos. -->
    <script src="script.js" defer></script>
    <script src="musica.js" defer></script>
  </body>
</html>
